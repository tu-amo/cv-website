<div id="ui-layer" class="absolute inset-0 pointer-events-none flex flex-col items-center justify-center z-10">
    <div class="relative w-full max-w-lg">
        <input type="text" id="wish-input" placeholder="Cast your wish..."
            class="w-full bg-transparent text-center text-2xl font-light text-white placeholder-white/30 border-b border-white/20 pb-2 focus:outline-none focus:border-cyan-400 transition-colors pointer-events-auto font-sans tracking-wider"
            autocomplete="off" />
        <div id="instruction"
            class="text-center text-white/40 mt-4 text-sm font-light tracking-widest opacity-0 transition-opacity duration-1000">
            PRESS ENTER TO RELEASE
        </div>
    </div>

    <!-- Depth Slider -->
    <div class="absolute right-8 top-1/2 -translate-y-1/2 flex flex-col items-center gap-4 pointer-events-auto">
        <span
            class="text-white/30 text-xs font-light tracking-widest uppercase rotate-90 origin-center translate-y-8">Depth</span>
        <input type="range" id="depth-slider" min="0" max="1" step="0.01" value="0.1"
            class="h-64 w-1 appearance-none bg-white/10 rounded-full outline-none slider-vertical"
            style="-webkit-appearance: slider-vertical;" />
    </div>
</div>
