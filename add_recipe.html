<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Recipe - The Living Cookbook</title>
    <!-- Modern Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="src/recipes.css">
    <style>
        .form-container {
            max-width: 800px;
            margin: 60px auto;
            background: var(--color-surface);
            padding: 40px;
            border-radius: 20px;
            border: 1px solid var(--color-divider);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            color: var(--color-accent-amber);
            text-transform: uppercase;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            background: rgba(26, 36, 33, 0.5);
            border: 1px solid var(--color-divider);
            padding: 12px 16px;
            border-radius: 8px;
            color: var(--color-text-papyrus);
            font-size: 1.1rem;
            transition: border-color var(--transition-smooth);
        }

        .form-control:focus {
            border-color: var(--color-accent-amber);
            background: rgba(26, 36, 33, 0.8);
        }

        .form-row {
            display: flex;
            gap: 20px;
        }

        .form-row .form-group {
            flex: 1;
        }

        textarea.form-control {
            min-height: 120px;
            resize: vertical;
        }

        .dynamic-list {
            margin-bottom: 30px;
        }

        .dynamic-item {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
        }

        .btn-add {
            background: transparent;
            color: var(--color-accent-amber);
            border: 1px dashed var(--color-accent-amber);
            padding: 10px 20px;
            border-radius: 8px;
            margin-top: 5px;
            transition: background var(--transition-smooth);
        }

        .btn-add:hover {
            background: var(--color-accent-amber-glow);
        }

        .btn-submit {
            background: var(--color-accent-amber);
            color: var(--color-bg-deep-olive);
            border: none;
            padding: 16px 32px;
            font-size: 1.2rem;
            font-weight: 600;
            border-radius: 30px;
            width: 100%;
            margin-top: 20px;
            transition: transform var(--transition-bounce), box-shadow var(--transition-smooth);
        }

        .btn-submit:hover {
            transform: translateY(-3px);
            box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3);
        }

        .nav-bar {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
        }

        .nav-link {
            color: var(--color-text-papyrus);
            text-decoration: none;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: color var(--transition-smooth);
        }

        .nav-link:hover {
            color: var(--color-accent-amber);
        }

        /* Scanner Styles */
        .scanner-panel {
            background: rgba(212, 175, 55, 0.05);
            border: 1px dashed var(--color-accent-amber);
            border-radius: 12px;
            padding: 25px;
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .btn-scan {
            background: transparent;
            color: var(--color-accent-amber);
            border: 1px solid var(--color-accent-amber);
            padding: 12px 24px;
            font-size: 1.1rem;
            border-radius: 30px;
            cursor: pointer;
            transition: all var(--transition-smooth);
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-scan:hover {
            background: var(--color-accent-amber);
            color: var(--color-bg-deep-olive);
        }

        .photo-upload-container {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
        }

        .btn-photo-upload {
            flex: 1;
            background: rgba(26, 36, 33, 0.5);
            border: 1px dashed var(--color-divider);
            padding: 20px;
            text-align: center;
            border-radius: 12px;
            cursor: pointer;
            transition: all var(--transition-smooth);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            color: var(--color-text-papyrus);
        }

        .btn-photo-upload:hover {
            border-color: var(--color-accent-amber);
            background: rgba(26, 36, 33, 0.8);
        }

        .btn-photo-upload.uploaded {
            border-color: #4CAF50;
            background: rgba(76, 175, 80, 0.1);
            color: #4CAF50;
        }

        .photo-upload-icon {
            opacity: 0.6;
            transition: stroke var(--transition-smooth);
        }

        .btn-photo-upload:hover .photo-upload-icon {
            stroke: var(--color-accent-amber);
            opacity: 1;
        }

        .btn-photo-upload.uploaded .photo-upload-icon {
            stroke: #4CAF50;
            opacity: 1;
        }

        .loader-text {
            display: none;
            color: var(--color-accent-amber);
            font-size: 1.1rem;
            margin-top: 15px;
        }

        .pulse-anim {
            animation: pulse-glow 1.5s infinite alternate;
        }

        @keyframes pulse-glow {
            from {
                opacity: 0.6;
                text-shadow: 0 0 5px var(--color-accent-amber-glow);
            }

            to {
                opacity: 1;
                text-shadow: 0 0 15px var(--color-accent-amber);
            }
        }
    </style>
</head>

<body>

    <nav class="nav-bar">
        <a href="recipes.html" class="nav-link">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            Back to Library
        </a>
    </nav>

    <div class="form-container">
        <h1 id="page-title" class="font-heading" style="font-size: 3rem; margin-bottom: 20px;">Add New Recipe</h1>

        <!-- AI Scanner Panel -->
        <div class="scanner-panel">
            <input type="file" id="scan-input" accept="image/*" style="display: none;">
            <button type="button" class="btn-scan" onclick="document.getElementById('scan-input').click()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242"></path>
                    <path d="M12 12v9"></path>
                    <path d="m8 17 4-4 4 4"></path>
                </svg>
                Auto-fill from Photo (AI)
            </button>
            <div id="scanner-loader" class="loader-text pulse-anim">
                Uploading to AI... Extracting text...
            </div>
        </div>

        <form id="recipe-add-form">
            <!-- Photos -->
            <div class="photo-upload-container">
                <input type="file" id="prep-photo-input" accept="image/*" style="display: none;">
                <div class="btn-photo-upload" id="btn-prep-photo"
                    onclick="document.getElementById('prep-photo-input').click()">
                    <svg class="photo-upload-icon" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z">
                        </path>
                        <circle cx="12" cy="13" r="4"></circle>
                    </svg>
                    <span>1. Upload Prep Photo</span>
                    <small style="opacity:0.5; font-size:0.8rem;">(Ingredients laid out)</small>
                </div>

                <input type="file" id="finished-photo-input" accept="image/*" style="display: none;">
                <div class="btn-photo-upload" id="btn-finished-photo"
                    onclick="document.getElementById('finished-photo-input').click()">
                    <svg class="photo-upload-icon" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z">
                        </path>
                        <circle cx="12" cy="13" r="4"></circle>
                    </svg>
                    <span>2. Upload Finished Photo</span>
                    <small style="opacity:0.5; font-size:0.8rem;">(The final meal)</small>
                </div>
            </div>

            <!-- Basic Info -->
            <div class="form-group">
                <label>Recipe Title</label>
                <input type="text" id="title" class="form-control" placeholder="e.g. Grandma's Lasagna" required>
            </div>

            <div class="form-group">
                <label>Reference / Source book</label>
                <input type="text" id="reference" class="form-control"
                    placeholder="e.g. The Essentials of Classic Italian Cooking, page 214" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Prep Time (mins)</label>
                    <input type="number" id="prep_time" class="form-control" placeholder="15">
                </div>
                <div class="form-group">
                    <label>Cook Time (mins)</label>
                    <input type="number" id="cook_time" class="form-control" placeholder="45">
                </div>
                <div class="form-group">
                    <label>Servings</label>
                    <input type="number" id="servings" class="form-control" placeholder="4">
                </div>
            </div>

            <!-- Ingredients -->
            <div class="form-group dynamic-list" id="ingredients-list">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px;">
                    <label style="margin-bottom:0;">Ingredients</label>
                    <button type="button" class="btn-scan"
                        style="font-size: 0.8rem; padding: 6px 12px; border-radius: 15px;"
                        onclick="standardizeIngredients()">
                        ✨ Standardize to Metric
                    </button>
                </div>
                <div class="dynamic-item">
                    <input type="number" class="form-control" placeholder="Qty" style="width: 80px;" name="qty">
                    <input type="text" class="form-control" placeholder="Unit (e.g. tbsp)" style="width: 120px;"
                        name="unit">
                    <input type="text" class="form-control" placeholder="Ingredient Name" name="ingName">
                    <input type="text" class="form-control" placeholder="Prep (e.g. minced)" name="prepName">
                </div>
                <button type="button" class="btn-add" id="btn-add-ingredient">+ Add another ingredient</button>
            </div>

            <!-- Steps -->
            <div class="form-group dynamic-list" id="steps-list">
                <label>Method Steps</label>
                <div class="dynamic-item">
                    <textarea class="form-control step-input" placeholder="Step 1: Preheat oven..."></textarea>
                </div>
                <button type="button" class="btn-add" id="btn-add-step">+ Add another step</button>
            </div>

            <button type="submit" id="btn-submit-recipe" class="btn-submit">Save Recipe to Library</button>
        </form>
    </div>

    <script>
        // --- Edit Mode Initialization ---
        const urlParams = new URLSearchParams(window.location.search);
        const editId = urlParams.get('id');

        if (editId) {
            document.getElementById('page-title').textContent = "Edit Recipe";
            document.getElementById('btn-submit-recipe').textContent = "Update Recipe";

            // Populating main fields for demo purposes
            fetch(`http://localhost:3001/recipes/${editId}`)
                .then(res => res.json())
                .then(data => {
                    document.getElementById('title').value = data.title || '';
                    document.getElementById('reference').value = data.reference_source || '';
                    document.getElementById('prep_time').value = data.prep_time_minutes || '';
                    document.getElementById('cook_time').value = data.cook_time_minutes || '';
                    document.getElementById('servings').value = data.servings || '';
                })
                .catch(err => console.error("Could not load recipe for editing.", err));
        }

        document.getElementById('btn-add-ingredient').addEventListener('click', () => {
            const container = document.getElementById('ingredients-list');
            const item = document.createElement('div');
            item.className = 'dynamic-item';
            item.innerHTML = `
        <input type="number" class="form-control" placeholder="Qty" style="width: 80px;" name="qty">
        <input type="text" class="form-control" placeholder="Unit (e.g. tbsp)" style="width: 120px;" name="unit">
        <input type="text" class="form-control" placeholder="Ingredient Name" name="ingName">
        <input type="text" class="form-control" placeholder="Prep (e.g. minced)" name="prepName">
      `;
            container.insertBefore(item, document.getElementById('btn-add-ingredient'));
        });

        document.getElementById('btn-add-step').addEventListener('click', () => {
            const container = document.getElementById('steps-list');
            const item = document.createElement('div');
            item.className = 'dynamic-item';
            item.innerHTML = `<textarea class="form-control step-input" placeholder="Next step..."></textarea>`;
            container.insertBefore(item, document.getElementById('btn-add-step'));
        });

        document.getElementById('recipe-add-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const title = document.getElementById('title').value;
            const reference = document.getElementById('reference').value;
            const prepTime = parseInt(document.getElementById('prep_time').value) || 0;
            const cookTime = parseInt(document.getElementById('cook_time').value) || 0;
            const servings = parseInt(document.getElementById('servings').value) || 0;

            const payload = {
                title, reference_source: reference, prep_time_minutes: prepTime, cook_time_minutes: cookTime, servings,
                image: "https://images.unsplash.com/photo-1495521821757-a1efb6729352?auto=format&fit=crop&q=80&w=2670"
            };

            const submitMethod = editId ? 'PATCH' : 'POST';
            const submitUrl = editId ? `http://localhost:3001/recipes/${editId}` : 'http://localhost:3001/recipes';

            try {
                // 1. Save/Update Main Recipe
                const response = await fetch(submitUrl, {
                    method: submitMethod,
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (!response.ok) {
                    alert('Error saving recipe. Is the local DB running?');
                    return;
                }

                const savedRecipe = await response.json();
                const recipeId = editId || savedRecipe.id;

                // 2. Clear out old related data if editing (naive approach for prototype)
                if (editId) {
                    // JSON Server doesn't easily support DELETE WHERE, so this is a simplified prototype
                    // In a real app like Supabase, you would Delete all rows where recipe_id = editId
                    // For now, we'll skip true deletion and just visually show it works.
                }

                // 3. Save new Ingredients
                const ingredientRows = document.querySelectorAll('#ingredients-list .dynamic-item');
                for (let row of ingredientRows) {
                    const qty = row.querySelector('input[name="qty"]').value;
                    const unit = row.querySelector('input[name="unit"]').value;
                    const name = row.querySelector('input[name="ingName"]').value;
                    const prep = row.querySelector('input[name="prepName"]').value;

                    if (name) {
                        // First create the ingredient (ignoring dupes for mock db)
                        const ingResponse = await fetch('http://localhost:3001/ingredients', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ name: name, default_unit: unit })
                        });
                        const savedIng = await ingResponse.json();

                        // Then create the relationship link
                        await fetch('http://localhost:3001/recipe_ingredients', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                recipe_id: recipeId,
                                ingredient_id: savedIng.id,
                                quantity: parseFloat(qty) || 0,
                                unit: unit,
                                preparation_note: prep
                            })
                        });
                    }
                }

                // 4. Save new Steps
                const stepTAs = document.querySelectorAll('#steps-list textarea');
                for (let i = 0; i < stepTAs.length; i++) {
                    const text = stepTAs[i].value;
                    if (text.trim() !== '') {
                        await fetch('http://localhost:3001/instruction_steps', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                recipe_id: recipeId,
                                step_number: i + 1,
                                instruction_text: text
                            })
                        });
                    }
                }

                alert(editId ? 'Recipe updated successfully!' : 'Recipe saved successfully!');
                window.location.href = 'recipes.html';

            } catch (err) {
                console.error(err);
                alert('Could not connect to Database. Make sure to restart your dev server!');
            }
        });

        // Photo Upload Handlers
        document.getElementById('prep-photo-input').addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                const btn = document.getElementById('btn-prep-photo');
                btn.classList.add('uploaded');
                btn.querySelector('span').textContent = "Prep Photo Attached!";
                btn.querySelector('small').textContent = e.target.files[0].name;
            }
        });

        document.getElementById('finished-photo-input').addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                const btn = document.getElementById('btn-finished-photo');
                btn.classList.add('uploaded');
                btn.querySelector('span').textContent = "Finished Photo Attached!";
                btn.querySelector('small').textContent = e.target.files[0].name;
            }
        });

        // Mock AI Scanner Logic
        document.getElementById('scan-input').addEventListener('change', (e) => {
            if (e.target.files.length === 0) return;

            // Show Loader
            const loader = document.getElementById('scanner-loader');
            loader.style.display = 'block';

            // Simulate 3 second API Call to OpenAI Vision
            setTimeout(() => {
                loader.style.display = 'none';
                populateMockApiData();
            }, 3000);
        });

        function populateMockApiData() {
            // Mock Data returned from our fake Cloud AI
            document.getElementById('title').value = "Classic Lemon Garlic Pasta";
            document.getElementById('reference').value = "Scanned from: The Pasta Grannies Cookbook, P. 45";
            document.getElementById('prep_time').value = 10;
            document.getElementById('cook_time').value = 15;
            document.getElementById('servings').value = 2;

            // Clear empty default rows
            document.getElementById('ingredients-list').innerHTML = `
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 8px;">
                    <label style="margin-bottom:0;">Ingredients</label>
                    <button type="button" class="btn-scan" style="font-size: 0.8rem; padding: 6px 12px; border-radius: 15px;" onclick="standardizeIngredients()">
                         ✨ Standardize to Metric
                    </button>
                </div>
                <button type="button" class="btn-add" id="btn-add-ingredient" style="margin-top:15px;">+ Add another ingredient</button>
            `;
            document.getElementById('steps-list').innerHTML = '<label>Method Steps</label><button type="button" class="btn-add" id="btn-add-step" style="margin-top:15px;">+ Add another step</button>';

            // We need to re-bind the buttons since we overwrote the innerHTML
            bindAddButtons();

            // Populate Mock Ingredients
            const mockIngredients = [
                { qty: 8, unit: "oz", name: "spaghetti", prep: "" },
                { qty: 2, unit: "tbsp", name: "olive oil", prep: "" },
                { qty: 4, unit: "cloves", name: "garlic", prep: "thinly sliced" },
                { qty: 1, unit: "whole", name: "lemon", prep: "juiced and zested" }
            ];

            mockIngredients.forEach(ing => {
                const container = document.getElementById('ingredients-list');
                const item = document.createElement('div');
                item.className = 'dynamic-item';
                item.innerHTML = `
                    <input type="number" class="form-control" style="width: 80px;" name="qty" value="${ing.qty}">
                    <input type="text" class="form-control" style="width: 120px;" name="unit" value="${ing.unit}">
                    <input type="text" class="form-control" name="ingName" value="${ing.name}">
                    <input type="text" class="form-control" name="prepName" value="${ing.prep}">
                `;
                container.insertBefore(item, document.getElementById('btn-add-ingredient'));
            });

            // Populate Mock Steps
            const mockSteps = [
                "Boil a large pot of salted water. Cook pasta until al dente.",
                "In a separate pan, heat the olive oil over medium heat. Add the thinly sliced garlic and sauté until fragrant, about 2 minutes.",
                "Drain the pasta, reserving 1/4 cup of the pasta water.",
                "Toss the pasta into the garlic oil. Pour in the reserved pasta water, lemon zest, and lemon juice. Toss vigorously until a glossy sauce forms."
            ];

            mockSteps.forEach(step => {
                const container = document.getElementById('steps-list');
                const item = document.createElement('div');
                item.className = 'dynamic-item';
                item.innerHTML = `<textarea class="form-control step-input">${step}</textarea>`;
                container.insertBefore(item, document.getElementById('btn-add-step'));
            });

            // Add a visual flash to show it worked
            const formContainer = document.querySelector('.form-container');
            formContainer.style.boxShadow = '0 0 30px rgba(212, 175, 55, 0.6)';
            setTimeout(() => {
                formContainer.style.boxShadow = '0 20px 40px rgba(0, 0, 0, 0.3)';
            }, 1000);
        }

        // Re-usuable bind function since we overwrite the DOM in the mock
        function bindAddButtons() {
            document.getElementById('btn-add-ingredient').addEventListener('click', () => {
                const container = document.getElementById('ingredients-list');
                const item = document.createElement('div');
                item.className = 'dynamic-item';
                item.innerHTML = `
                    <input type="number" class="form-control" placeholder="Qty" style="width: 80px;" name="qty">
                    <input type="text" class="form-control" placeholder="Unit (e.g. tbsp)" style="width: 120px;" name="unit">
                    <input type="text" class="form-control" placeholder="Ingredient Name" name="ingName">
                    <input type="text" class="form-control" placeholder="Prep (e.g. minced)" name="prepName">
                `;
                container.insertBefore(item, document.getElementById('btn-add-ingredient'));
            });

            document.getElementById('btn-add-step').addEventListener('click', () => {
                const container = document.getElementById('steps-list');
                const item = document.createElement('div');
                item.className = 'dynamic-item';
                item.innerHTML = `<textarea class="form-control step-input" placeholder="Next step..."></textarea>`;
                container.insertBefore(item, document.getElementById('btn-add-step'));
            });
        }

        // --- Measurement Standardization Logic ---
        const densityDB = {
            "all-purpose flour": 120,
            "flour": 120,
            "granulated sugar": 200,
            "sugar": 200,
            "brown sugar": 220,
            "butter": 227,
            "water": 236,
            "milk": 240,
            "heavy cream": 238,
            "olive oil": 216,
            "oil": 216,
            "honey": 340,
            "salt": 273,
            "spaghetti": 114 // approx per cup broken
        };

        function standardizeIngredients() {
            const items = document.querySelectorAll('#ingredients-list .dynamic-item');
            let updatedCount = 0;

            items.forEach(item => {
                const qtyInput = item.querySelector('input[name="qty"]');
                const unitInput = item.querySelector('input[name="unit"]');
                const nameInput = item.querySelector('input[name="ingName"]');

                if (!qtyInput.value || !unitInput.value || !nameInput.value) return;

                let qty = parseFloat(qtyInput.value);
                let unit = unitInput.value.toLowerCase().trim();
                let name = nameInput.value.toLowerCase().trim();

                // 1. Ounces to Grams (Mass)
                if (unit === 'oz' || unit === 'ounce' || unit === 'ounces') {
                    qtyInput.value = Math.round(qty * 28.3495);
                    unitInput.value = 'g';
                    item.style.animation = 'pulse-glow 1s';
                    setTimeout(() => item.style.animation = '', 1000);
                    updatedCount++;
                    return;
                }

                // 2. Volume to Weight (Density required)
                let densityPerCup = densityDB[name];
                if (!densityPerCup) return; // Cannot convert volume to weight without density

                const volumeRatios = {
                    "cup": 1, "cups": 1, "c": 1,
                    "tbsp": 0.0625, "tablespoon": 0.0625, "tablespoons": 0.0625,
                    "tsp": 0.0208, "teaspoon": 0.0208, "teaspoons": 0.0208,
                    "fl oz": 0.125, "fluid ounce": 0.125
                };

                const ratio = volumeRatios[unit];
                if (ratio) {
                    qtyInput.value = Math.round((qty * ratio) * densityPerCup);
                    unitInput.value = 'g';
                    item.style.animation = 'pulse-glow 1s';
                    setTimeout(() => item.style.animation = '', 1000);
                    updatedCount++;
                }
            });

            if (updatedCount > 0) {
                alert(`Standardized ${updatedCount} ingredients to metric grams!`);
            } else {
                alert("No non-metric volume measurements were found, or the ingredient density for conversion is unknown.");
            }
        }

        // --- Servings Scaler Logic ---
        let previousServings = null;
        const servingsInput = document.getElementById('servings');

        // Capture the original value before the user changes it
        servingsInput.addEventListener('focus', function () {
            previousServings = parseFloat(this.value);
        });

        // When the value changes, scale all ingredient quantities
        servingsInput.addEventListener('change', function () {
            const newServings = parseFloat(this.value);

            // Only scale if both old and new values are valid numbers
            if (previousServings && newServings && previousServings !== newServings) {
                const ratio = newServings / previousServings;
                const items = document.querySelectorAll('#ingredients-list .dynamic-item');

                items.forEach(item => {
                    const qtyInput = item.querySelector('input[name="qty"]');
                    if (qtyInput && qtyInput.value) {
                        const currentQty = parseFloat(qtyInput.value);
                        // Multiply by ratio and round to the nearest whole number
                        qtyInput.value = Math.round(currentQty * ratio);

                        // Give a subtle visual cue that quantities scaled
                        item.style.animation = 'pulse-glow 0.8s';
                        setTimeout(() => item.style.animation = '', 800);
                    }
                });
            }

            // Update the previous value so subsequent changes calculate from this new baseline
            previousServings = newServings;
        });

        // Prevent Enter key from submitting the form accidentally while typing or scaling
        document.getElementById('recipe-add-form').addEventListener('keydown', function (e) {
            if (e.key === 'Enter' && e.target.tagName === 'INPUT') {
                e.preventDefault();
                e.target.blur(); // Trigger the change event instantly so scaling still works
            }
        });
    </script>
</body>

</html>
