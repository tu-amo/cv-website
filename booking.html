<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book a Session — Jane Petra Scott</title>

    <!-- SEO Meta Tags -->
    <meta name="description"
        content="Book a session with Jane Petra Scott for SAP architecture consulting, digital transformation strategy, or mentorship." />
    <meta name="author" content="Jane Petra Scott" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://janeblog.com/booking" />
    <meta property="og:title" content="Book a Session — Jane Petra Scott" />
    <meta property="og:description"
        content="Book a session with Jane Petra Scott for SAP architecture consulting or digital transformation strategy." />

    <!-- Performance: Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://assets.calendly.com">

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap"
        rel="stylesheet">

    <!-- Shared framework: tokens → nav → shells → page CSS -->
    <link rel="stylesheet" href="/src/tokens.css" />
    <link rel="stylesheet" href="/src/nav.css" />
    <link rel="stylesheet" href="/src/shells.css" />

    <style>


        /* ===== LAYOUT ===== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--space-xl) var(--space-md);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ===== NAV BAR ===== */
        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--space-xl);
        }

        .nav-back {
            display: inline-flex;
            align-items: center;
            gap: var(--space-xs);
            color: var(--color-text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color var(--transition-base);
        }

        .nav-back:hover {
            color: var(--color-text-primary);
        }

        .nav-label {
            font-size: 0.875rem;
            color: var(--color-text-muted);
            font-weight: 400;
        }

        /* ===== PAGE HEADER ===== */
        .page-header {
            text-align: center;
            margin-bottom: var(--space-xl);
        }

        .page-eyebrow {
            display: inline-block;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--color-primary);
            background: var(--color-primary-soft);
            padding: 0.35em 0.9em;
            border-radius: var(--radius-full);
            margin-bottom: var(--space-md);
        }

        .page-title {
            font-family: var(--font-display);
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 700;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
            margin-bottom: var(--space-sm);
        }

        .page-subtitle {
            font-size: 1.05rem;
            color: var(--color-text-secondary);
            max-width: 600px;
            margin: 0 auto;
        }

        /* ===== CALENDLY SECTION ===== */
        .booking-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            overflow: hidden;
            box-shadow: var(--shadow-xl);
            width: 100%;
            margin-bottom: var(--space-xl);
        }

        /* Set a fixed height for the widget container to prevent layout shifts */
        .calendly-inline-widget {
            width: 100%;
            height: 900px !important;
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            padding: var(--space-xl) 0 var(--space-md);
            color: var(--color-text-secondary);
            font-size: 0.875rem;
            border-top: 1px solid var(--color-border);
            margin-top: auto;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .container {
                padding: var(--space-lg) var(--space-md);
            }

            .page-header {
                margin-bottom: var(--space-lg);
            }

            .calendly-inline-widget {
                height: 1000px !important;
                /* Taller on mobile for better scrolling */
            }
        }
    </style>
</head>

<body>
    <a href="#main-content" class="skip-link">Skip to main content</a>
    <div class="background-globes" aria-hidden="true">
        <div class="globe globe-1"></div>
        <div class="globe globe-2"></div>
        <div class="globe globe-3"></div>
    </div>

    <nav class="site-nav" aria-label="Site navigation">
        <a href="/" class="site-nav__brand" aria-label="Jane Petra Scott — Home">
            <span class="site-nav__brand-name">Jane Petra Scott</span>
            <span class="site-nav__brand-sub">SAP Architect &amp; Digital Transformation</span>
        </a>
        <div class="site-nav__links">
            <a href="/" class="site-nav__link">Home</a>
            <a href="/blog.html" class="site-nav__link">Writing</a>
            <a href="/booking.html" class="site-nav__link site-nav__link--active">Booking</a>
            <a href="/cv" class="site-nav__link">CV</a>
        </div>
    </nav>

    <main class="page-shell" id="main-content">

        <!-- Page header -->
        <header class="page-header">
            <span class="page-eyebrow">Booking</span>
            <h1 class="page-title">Book a Session</h1>
            <p class="page-subtitle">Select a time that works for you. Whether it's a quick chat, architecture
                deep-dive, or strategic consultation.</p>
        </header>

        <!-- Calendly widget -->
        <section class="booking-card" aria-label="Calendly booking widget">
            <!-- Calendly inline widget begin -->
            <div class="calendly-inline-widget"
                data-url="https://calendly.com/0001japs/new-meeting?hide_landing_page_details=1&hide_gdpr_banner=1&background_color=0d1a16&text_color=f8fafc&primary_color=d4a373&back=1"
                style="min-width:320px; width:100%; height:900px;"></div>
            <script type="text/javascript" src="https://assets.calendly.com/assets/external/widget.js" async></script>
            <!-- Calendly inline widget end -->
        </section>

        <footer class="page-footer">
            <p>Architected &amp; Designed by Jane Petra Scott © 2026</p>
        </footer>
    </main>
</body>

</html>
