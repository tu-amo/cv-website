<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Book a Session — Jane Petra Scott</title>

    <!-- SEO Meta Tags -->
    <meta name="description"
        content="Book a session with Jane Petra Scott for SAP architecture consulting, digital transformation strategy, or mentorship." />
    <meta name="author" content="Jane Petra Scott" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://janeblog.com/booking" />
    <meta property="og:title" content="Book a Session — Jane Petra Scott" />
    <meta property="og:description"
        content="Book a session with Jane Petra Scott for SAP architecture consulting or digital transformation strategy." />

    <!-- Performance: Preconnect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://assets.calendly.com">

    <!-- Fonts -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,700;1,400&display=swap"
        rel="stylesheet">

    <style>
        /* ===== DESIGN TOKENS ===== */
        :root {
            --color-primary: #2563eb;
            --color-primary-hover: #3b82f6;
            --color-secondary: #94a3b8;
            --color-text-primary: #f8fafc;
            --color-text-secondary: #cbd5e1;
            --color-text-muted: #94a3b8;
            --color-background: #0f172a;
            --color-surface: rgba(30, 41, 59, 0.7);
            --color-border: rgba(255, 255, 255, 0.1);
            --color-accent: #8b5cf6;
            --color-accent-soft: rgba(139, 92, 246, 0.15);
            --color-primary-soft: rgba(37, 99, 235, 0.15);

            --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --font-display: 'Playfair Display', Georgia, serif;

            --space-xs: 0.5rem;
            --space-sm: 1rem;
            --space-md: 1.5rem;
            --space-lg: 2rem;
            --space-xl: 3rem;
            --space-2xl: 4rem;
            --space-3xl: 6rem;

            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);

            --radius-sm: 0.375rem;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --radius-xl: 1rem;
            --radius-full: 9999px;

            --transition-base: 300ms cubic-bezier(0.4, 0, 0.2, 1);

            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
        }

        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            font-size: 16px;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        body {
            font-family: var(--font-sans);
            color: var(--color-text-primary);
            background: var(--color-background);
            line-height: 1.6;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ===== BACKGROUND GLOBES ===== */
        .background-globes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            overflow: hidden;
            pointer-events: none;
        }

        .globe {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle at 30% 30%, rgba(37, 99, 235, 0.2), rgba(139, 92, 246, 0.1));
            filter: blur(80px);
            opacity: 0.6;
            animation: float 20s infinite ease-in-out;
        }

        .globe-1 {
            width: 500px;
            height: 500px;
            top: -200px;
            right: -100px;
            animation-delay: 0s;
        }

        .globe-2 {
            width: 400px;
            height: 400px;
            bottom: -150px;
            left: -100px;
            animation-delay: -7s;
        }

        .globe-3 {
            width: 350px;
            height: 350px;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation-delay: -14s;
        }

        @keyframes float {

            0%,
            100% {
                transform: translate(0, 0) scale(1);
            }

            33% {
                transform: translate(30px, -30px) scale(1.1);
            }

            66% {
                transform: translate(-20px, 20px) scale(0.9);
            }
        }

        /* ===== LAYOUT ===== */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--space-xl) var(--space-md);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* ===== NAV BAR ===== */
        .nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: var(--space-xl);
        }

        .nav-back {
            display: inline-flex;
            align-items: center;
            gap: var(--space-xs);
            color: var(--color-text-secondary);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
            transition: color var(--transition-base);
        }

        .nav-back:hover {
            color: var(--color-text-primary);
        }

        .nav-label {
            font-size: 0.875rem;
            color: var(--color-text-muted);
            font-weight: 400;
        }

        /* ===== PAGE HEADER ===== */
        .page-header {
            text-align: center;
            margin-bottom: var(--space-xl);
        }

        .page-eyebrow {
            display: inline-block;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: var(--color-primary);
            background: var(--color-primary-soft);
            padding: 0.35em 0.9em;
            border-radius: var(--radius-full);
            margin-bottom: var(--space-md);
        }

        .page-title {
            font-family: var(--font-display);
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 700;
            background: linear-gradient(135deg, var(--color-primary) 0%, var(--color-accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1.2;
            margin-bottom: var(--space-sm);
        }

        .page-subtitle {
            font-size: 1.05rem;
            color: var(--color-text-secondary);
            max-width: 600px;
            margin: 0 auto;
        }

        /* ===== CALENDLY SECTION ===== */
        .booking-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            overflow: hidden;
            box-shadow: var(--shadow-xl);
            width: 100%;
            margin-bottom: var(--space-xl);
        }

        /* Set a fixed height for the widget container to prevent layout shifts */
        .calendly-inline-widget {
            width: 100%;
            height: 900px !important;
        }

        /* ===== FOOTER ===== */
        .footer {
            text-align: center;
            padding: var(--space-xl) 0 var(--space-md);
            color: var(--color-text-secondary);
            font-size: 0.875rem;
            border-top: 1px solid var(--color-border);
            margin-top: auto;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .container {
                padding: var(--space-lg) var(--space-md);
            }

            .page-header {
                margin-bottom: var(--space-lg);
            }

            .calendly-inline-widget {
                height: 1000px !important;
                /* Taller on mobile for better scrolling */
            }
        }
    </style>
</head>

<body>
    <div class="background-globes" aria-hidden="true">
        <div class="globe globe-1"></div>
        <div class="globe globe-2"></div>
        <div class="globe globe-3"></div>
    </div>

    <main class="container" id="main-content">
        <!-- Nav -->
        <nav class="nav" aria-label="Page navigation">
            <a href="/" class="nav-back" aria-label="Back to home">
                <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"
                    aria-hidden="true">
                    <path d="M10 12L6 8L10 4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
                Back to home
            </a>
            <span class="nav-label">Availability</span>
        </nav>

        <!-- Page header -->
        <header class="page-header">
            <span class="page-eyebrow">Booking</span>
            <h1 class="page-title">Book a Session</h1>
            <p class="page-subtitle">Select a time that works for you. Whether it's a quick chat, architecture
                deep-dive, or strategic consultation.</p>
        </header>

        <!-- Calendly widget -->
        <section class="booking-card" aria-label="Calendly booking widget">
            <!-- Calendly inline widget begin -->
            <div class="calendly-inline-widget"
                data-url="https://calendly.com/0001japs/new-meeting?hide_landing_page_details=1&hide_gdpr_banner=1&background_color=0f172a&text_color=f8fafc&primary_color=2563eb&back=1"
                style="min-width:320px; width:100%; height:900px;"></div>
            <script type="text/javascript" src="https://assets.calendly.com/assets/external/widget.js" async></script>
            <!-- Calendly inline widget end -->
        </section>

        <footer class="footer">
            <p>Architected & Designed by Jane Petra Scott © 2026</p>
        </footer>
    </main>
</body>

</html>
